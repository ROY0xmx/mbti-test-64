<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>MBTI 64人格 · 三阶测试</title>
<style>
  html { color-scheme: light only; background: #f5f5f5; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  *::selection { background: transparent; color: inherit; }
  body { background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; color-scheme: light only; }
  .test-container { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); padding: 40px 35px; max-width: 800px; width: 100%; border: 1px solid #eaeaea; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600; color: #0b2b4a; text-align: center; margin-bottom: 8px; letter-spacing: -0.02em; }
  .subhead { text-align: center; color: #4a5b6b; font-size: clamp(0.85rem, 3vw, 1rem); margin-bottom: 24px; border-bottom: 1px solid #e0e0e0; padding-bottom: 18px; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .version-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; flex: 1; }
  .version-tab { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }
  .version-tab:hover { background: #fff; border-color: #1e3c5a; }
  .version-tab.active { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .version-tab .badge { display: inline-block; background: #eef1f4; color: #0b2b4a; font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 30px; margin-left: 6px; }
  .version-tab.active .badge { background: #fff; color: #0b2b4a; }
  .history-toggle { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 0.95rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; white-space: nowrap; }
  .history-toggle:hover { background: #fff; border-color: #1e3c5a; }
  .history-section { margin-bottom: 22px; border: 1px solid #eaeaea; background: #f9fafb; border-radius: 18px; padding: 16px 18px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #0b2b4a; font-weight: 600; font-size: 1rem; }
  .history-clear { background: none; border: none; color: #4a5b6b; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
  .history-item { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; cursor: pointer; transition: all 0.2s; }
  .history-item:hover { border-color: #1e3c5a; box-shadow: 0 4px 12px rgba(30,60,90,0.08); }
  .history-item .h-type { font-weight: 700; color: #0b2b4a; font-size: 1rem; }
  .history-item .h-meta { font-size: 0.8rem; color: #6b7d8f; }
  .history-empty { color: #8a9aa8; font-size: 0.9rem; padding: 4px 0; }
  .progress-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-weight: 500; gap: 8px; flex-wrap: wrap; }
  .question-counter { background: #f0f2f4; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; color: #0b2b4a; border: 1px solid #d6dde3; white-space: nowrap; }
  .progress-bar-bg { flex-grow: 1; min-width: 100px; height: 8px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 8px; background: #1e3c5a; width: 0%; border-radius: 10px; transition: width .15s ease; }
  .question-text { font-size: clamp(1.05rem, 4vw, 1.4rem); font-weight: 500; color: #0b2b4a; line-height: 1.45; margin-bottom: 26px; min-height: 70px; display: flex; align-items: center; }
  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
  .option-btn { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 16px; padding: 14px 18px; font-size: clamp(0.9rem, 3.2vw, 1rem); font-weight: 500; color: #1e3c5a; text-align: left; cursor: pointer; transition: all .1s ease; display: flex; align-items: flex-start; line-height: 1.45; word-break: break-word; }
  .option-btn:hover { background: #fff; border-color: #1e3c5a; box-shadow: 0 4px 12px rgba(0,20,40,.06); }
  .option-btn.selected { background: #fff; border-color: #1e3c5a; border-width: 2px; box-shadow: 0 4px 14px rgba(20,50,80,.1); }
  .option-letter { display: inline-block; width: 24px; height: 24px; background: #eef1f4; border-radius: 50%; text-align: center; line-height: 24px; font-size: 0.8rem; font-weight: 600; color: #0b2b4a; margin-right: 12px; flex-shrink: 0; margin-top: 1px; }
  .option-btn.selected .option-letter { background: #1e3c5a; color: #fff; }
  .nav-buttons { display: flex; justify-content: space-between; gap: 12px; }
  .nav-btn { background: #fff; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 11px 26px; font-size: clamp(0.9rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; flex: 1; }
  .nav-btn:hover:not(:disabled) { background: #f0f4f8; border-color: #1e3c5a; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-btn.primary { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .nav-btn.primary:hover:not(:disabled) { background: #0b2b4a; border-color: #0b2b4a; }
  .result-screen { padding: 10px 0 6px; }
  .result-header { text-align: center; margin-bottom: 8px; }
  .result-type { font-size: clamp(2.4rem, 12vw, 4.2rem); font-weight: 700; color: #0b2b4a; letter-spacing: 2px; line-height: 1.1; margin-bottom: 10px; }
  .result-title { font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 500; color: #1e3c5a; margin-bottom: 6px; }
  .result-tagline { font-size: clamp(0.9rem, 3vw, 1rem); color: #4a5b6b; margin-bottom: 22px; }
  .dims-bar { display: flex; flex-direction: column; gap: 10px; background: #f9fafb; border: 1px solid #eaeaea; border-radius: 18px; padding: 16px 18px; margin-bottom: 26px; }
  .dim-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #1e3c5a; }
  .dim-label { width: 46px; font-weight: 600; color: #0b2b4a; text-align: center; font-size: 0.8rem; flex-shrink: 0; }
  .dim-track { flex-grow: 1; min-width: 60px; height: 18px; background: #e9ecef; border-radius: 20px; overflow: hidden; display: flex; }
  .dim-fill-left { height: 100%; background: #1e3c5a; }
  .dim-fill-right { height: 100%; background: #b0c4d4; }
  .dim-pct { width: 40px; text-align: right; font-weight: 500; color: #1e3c5a; font-size: 0.8rem; flex-shrink: 0; }
  .result-desc { font-size: clamp(0.9rem, 3.2vw, 1rem); color: #3f5567; line-height: 1.85; margin-bottom: 26px; border-top: 1px solid #e0e0e0; padding-top: 22px; }
  .result-desc p { margin-bottom: 16px; text-indent: 2em; text-align: justify; }
  .result-desc h3 { font-size: 1.15rem; color: #0b2b4a; margin: 28px 0 14px; font-weight: 600; border-left: 4px solid #1e3c5a; padding-left: 10px; text-indent: 0; }
  .result-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
  .restart-btn { background: #fff; border: 1.5px solid #1e3c5a; border-radius: 40px; padding: 13px 36px; font-size: clamp(0.95rem, 3vw, 1.05rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }
  .restart-btn:hover { background: #1e3c5a; color: #fff; }
  .hidden { display: none; }
  @media (max-width: 560px) {
    body { padding: 0; }
    .test-container { border-radius: 0; border: none; box-shadow: none; padding: 20px 16px 30px; min-height: 100vh; }
    .top-bar { flex-direction: row; align-items: center; }
    .version-tabs { justify-content: flex-start; gap: 8px; }
    .version-tab { padding: 7px 14px; }
    .history-toggle { padding: 7px 14px; align-self: center; }
    .question-text { min-height: 60px; }
    .option-btn { padding: 12px 14px; }
    .option-letter { width: 22px; height: 22px; line-height: 22px; font-size: 0.75rem; margin-right: 10px; }
    .nav-btn { padding: 11px 16px; }
    .dims-bar { padding: 14px 14px; }
    .result-desc { padding-top: 18px; }
  }
  @media (max-width: 380px) {
    .version-tab .badge { display: none; }
    .dim-label { width: 38px; font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div class="test-container">
  <h1>MBTI 64人格 · 三阶测试</h1>
  <div class="subhead">16型人格亚型 · 40 / 100 / 200 题动态深度解析</div>

  <div class="top-bar">
    <div class="version-tabs">
      <button class="version-tab active" data-version="40">极简版 <span class="badge">40题</span></button>
      <button class="version-tab" data-version="100">普通版 <span class="badge">100题</span></button>
      <button class="version-tab" data-version="200">深度思考版 <span class="badge">200题</span></button>
    </div>
    <button class="history-toggle" id="mainHistoryToggle">历史记录</button>
  </div>

  <div class="history-section hidden" id="mainHistorySection">
    <div class="history-header">
      <span>测试历史（点击可查看解析）</span>
      <button class="history-clear" id="mainHistoryClear">清空</button>
    </div>
    <div class="history-list" id="mainHistoryList"></div>
  </div>

  <div id="quizArea">
    <div class="progress-area">
      <span class="question-counter" id="counter">1 / 40</span>
      <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
    </div>
    <div class="question-text" id="questionText">正在加载...</div>
    <div class="options" id="optionsContainer"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" disabled>上一题</button>
      <button class="nav-btn primary" id="nextBtn">下一题</button>
    </div>
  </div>

  <div id="resultArea" class="result-screen hidden">
    <div class="result-header">
      <div class="result-type" id="resultType">—</div>
      <div class="result-title" id="resultTitle">—</div>
      <div class="result-tagline" id="resultTagline"></div>
    </div>
    <div class="dims-bar" id="dimsBar"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-actions">
      <button class="restart-btn" id="restartBtn">重新测试</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ============================================================
  // 40题（极简版）独立题库 —— 40 条完全唯一
  // ============================================================
  const SIMPLE_BASE = [
    { text: "在热闹的聚会上，你通常会：", options: [{ label: "主动和很多人打招呼，越热闹越有精神", value: "E" }, { label: "找一两个聊得来的人深入交流", value: "I" }, { label: "先观察现场，再决定要不要加入", value: "I" }, { label: "成为话题中心，带动整场气氛", value: "E" }] },
    { text: "接手一个完全陌生的项目，你的第一步是：", options: [{ label: "先动手做，边做边找感觉", value: "S" }, { label: "先想清楚整体框架和可能的路径", value: "N" }, { label: "翻出以往类似案例照着走", value: "S" }, { label: "先 brainstorm 一堆创意方向", value: "N" }] },
    { text: "在做重要决定时，你更信任：", options: [{ label: "数据、事实和逻辑推演", value: "T" }, { label: "自己的感受和它对他人的影响", value: "F" }, { label: "公平的规则和效率优先", value: "T" }, { label: "人情关系和整体和谐", value: "F" }] },
    { text: "你的日常生活节奏更像：", options: [{ label: "有清晰的日程表，按部就班", value: "J" }, { label: "随性而行，看当天心情", value: "P" }, { label: "有大框架，细节灵活调整", value: "J" }, { label: "走到哪算哪，享受意外", value: "P" }] },
    { text: "当你需要给自己“充电”时，你会选择：", options: [{ label: "约朋友出门，热闹一场", value: "E" }, { label: "一个人待着，安静看书或听歌", value: "I" }, { label: "参加集体活动，感受人群氛围", value: "E" }, { label: "独自散步、发呆或写点东西", value: "I" }] },
    { text: "你更容易被什么吸引注意力？", options: [{ label: "具体的细节、事实和现实状况", value: "S" }, { label: "背后的模式、隐喻和未来可能", value: "N" }, { label: "眼前亟待解决的实际问题", value: "S" }, { label: "事物深层含义和长远走向", value: "N" }] },
    { text: "当冲突发生时，你的第一反应是：", options: [{ label: "直接指出问题，就事论事", value: "T" }, { label: "先考虑对方情绪，尽量温和", value: "F" }, { label: "用事实和逻辑把道理讲清楚", value: "T" }, { label: "先安抚情绪，再慢慢沟通", value: "F" }] },
    { text: "你的书桌或工作区更接近：", options: [{ label: "物品分类清楚，井井有条", value: "J" }, { label: "看起来有点乱，但自己找得到", value: "P" }, { label: "文件按项目或主题归档", value: "J" }, { label: "东西随手放，用时再翻", value: "P" }] },
    { text: "你更享受哪一种对话？", options: [{ label: "聊现实生活、具体经验和操作", value: "S" }, { label: "聊抽象概念、未来设想和意义", value: "N" }, { label: "讨论实际步骤和落地方法", value: "S" }, { label: "聊理想、哲学和可能性", value: "N" }] },
    { text: "下面哪句话你更认同？", options: [{ label: "情感是决策中不可忽视的因素", value: "F" }, { label: "公平的规则比个人感受更重要", value: "T" }, { label: "理解他人感受是首要的", value: "F" }, { label: "逻辑一致才是解决问题的关键", value: "T" }] },
    { text: "出门旅行前，你通常会：", options: [{ label: "做详细攻略，把行程排好", value: "J" }, { label: "订好交通住宿，其他随缘", value: "P" }, { label: "列出必去景点和时间表", value: "J" }, { label: "到了再说，享受即兴探索", value: "P" }] },
    { text: "你觉得自己更偏向：", options: [{ label: "在人群中获得能量", value: "E" }, { label: "在独处中恢复精力", value: "I" }, { label: "喜欢热闹，但也需要独处", value: "E" }, { label: "社交后需要长时间安静", value: "I" }] },
    { text: "你更容易记住：", options: [{ label: "具体的数字、事实和细节", value: "S" }, { label: "整体印象和当时的感觉", value: "N" }, { label: "事件的经过和关键细节", value: "S" }, { label: "事情带来的启发和意义", value: "N" }] },
    { text: "朋友向你倾诉烦恼时，你更倾向于：", options: [{ label: "帮他分析问题，给出方案", value: "T" }, { label: "先共情，让他感到被理解", value: "F" }, { label: "指出问题所在，理性建议", value: "T" }, { label: "耐心倾听，给予情感支持", value: "F" }] },
    { text: "你更喜欢哪种工作环境？", options: [{ label: "流程清晰、截止日期明确", value: "J" }, { label: "弹性自由、可自行安排", value: "P" }, { label: "结构清楚、职责分明", value: "J" }, { label: "灵活多变、鼓励即兴", value: "P" }] },
    { text: "在社交场合，你通常：", options: [{ label: "主动和陌生人打开话匣", value: "E" }, { label: "等别人来和你搭话", value: "I" }, { label: "很快融入群体，谈笑风生", value: "E" }, { label: "只和少数人深入交流", value: "I" }] },
    { text: "你更倾向于相信：", options: [{ label: "眼见为实，经验最可靠", value: "S" }, { label: "直觉和灵感带来的启发", value: "N" }, { label: "经过验证的事实和数据", value: "S" }, { label: "内心的预感与洞见", value: "N" }] },
    { text: "你更看重一个人的：", options: [{ label: "能力和逻辑清晰度", value: "T" }, { label: "善良和情感细腻度", value: "F" }, { label: "公正和原则性", value: "T" }, { label: "同理心和包容度", value: "F" }] },
    { text: "对于还没完成的任务，你会：", options: [{ label: "感到不安，想尽快做完", value: "J" }, { label: "觉得可以灵活处理，不急", value: "P" }, { label: "制定计划逐步推进", value: "J" }, { label: "先放一放，等状态好了再做", value: "P" }] },
    { text: "你更常是：", options: [{ label: "先行动，再思考", value: "E" }, { label: "先思考，再行动", value: "I" }, { label: "边做边说，享受互动", value: "E" }, { label: "想清楚再表达", value: "I" }] },
    { text: "你更容易被什么说服？", options: [{ label: "数据和案例", value: "S" }, { label: "理念和愿景", value: "N" }, { label: "真实发生的事例", value: "S" }, { label: "富有想象力的蓝图", value: "N" }] },
    { text: "你更愿意成为：", options: [{ label: "公正的裁判", value: "T" }, { label: "温暖的倾听者", value: "F" }, { label: "客观的分析者", value: "T" }, { label: "贴心的支持者", value: "F" }] },
    { text: "你更喜欢做：", options: [{ label: "已经知道怎么做的事", value: "J" }, { label: "需要即兴发挥的事", value: "P" }, { label: "有明确步骤的任务", value: "J" }, { label: "充满变数的挑战", value: "P" }] },
    { text: "独处的时候，你感到：", options: [{ label: "有时无聊，想找人说话", value: "E" }, { label: "非常自在，享受安静", value: "I" }, { label: "过一会儿就想联系朋友", value: "E" }, { label: "这是宝贵的休息时间", value: "I" }] },
    { text: "你更关注：", options: [{ label: "当下正在发生的事", value: "S" }, { label: "未来可能发生的事", value: "N" }, { label: "眼前的实际问题", value: "S" }, { label: "长远的发展趋势", value: "N" }] },
    { text: "当团队出现分歧，你更倾向于：", options: [{ label: "提出一个最理性的方案", value: "T" }, { label: "协调各方情绪，达成共识", value: "F" }, { label: "分析利弊，选出最优解", value: "T" }, { label: "照顾每个人的感受", value: "F" }] },
    { text: "你更习惯：", options: [{ label: "提前做好计划", value: "J" }, { label: "随机应变", value: "P" }, { label: "列出待办事项清单", value: "J" }, { label: "根据当天状态调整", value: "P" }] },
    { text: "你更愿意：", options: [{ label: "在热闹中寻找乐趣", value: "E" }, { label: "在安静中寻找深度", value: "I" }, { label: "参加聚会拓展人脉", value: "E" }, { label: "一个人读书或思考", value: "I" }] },
    { text: "你更相信：", options: [{ label: "实践出真知", value: "S" }, { label: "想象力驱动世界", value: "N" }, { label: "亲身经历最可靠", value: "S" }, { label: "灵感比经验更重要", value: "N" }] },
    { text: "你认为更重要的是：", options: [{ label: "公平", value: "T" }, { label: "仁慈", value: "F" }, { label: "规则面前人人平等", value: "T" }, { label: "体谅每个人的难处", value: "F" }] },

  function pickRandom(pool, used) {
    const avail = pool.filter(p => !used.has(p));
    if (!avail.length) return null;
    const chosen = avail[Math.floor(Math.random() * avail.length)];
    used.add(chosen);
    return chosen;
  }

  // ============================================================

  const POOL_INTRO = [
    `你的表人格类型是 <strong>{variant}</strong>，属于 {title} 一族。你的四个维度偏好比例已经绘制在下方，以下解析完全基于你的实际得分比例动态生成，只针对你呈现给世界的这一面。`,
    `你是 <strong>{variant}</strong>，{title}家族的一员。你的维度得分并不极端，也不是平均值，而是带着你自己的倾斜。下面这份解析，只对你表人格的这一面负责。`,
    `你的表人格是 <strong>{variant}</strong>（{title}）。四个维度上你的偏好程度各不相同，这决定了你不是一个“标准模板”，而是一个有自己比例的个体。`,
    `你的表人格亚型是 <strong>{variant}</strong>。它意味着你在 {title} 的大框架下，有自己的具体用力点。以下解析按你的实际比例展开。`,
    `你被判定为 <strong>{variant}</strong>。这不是一个标签，而是一组偏好比例的缩写。以下内容会依据你的表人格实际得分来调整侧重。`,
    `你是 <strong>{variant}</strong>，属于 {title} 一族。你的比例让这份解析不会完全套用模板，而是会围绕你的表人格具体强弱点展开。`,
    `你的结果是 <strong>{variant}</strong>。{title} 的底色之上，你的表人格具体倾斜决定了哪些段落会更戳你。以下按比例逐段展开。`,
    `你落在 <strong>{variant}</strong> 这个格子里。{title} 是底色，具体比例是你的纹路。以下解析基于你的表人格比例生成，不是通用文案。`
  ];

  const POOL_EI_HIGH_E = [
    `你的 E 维度非常突出。你喜欢热闹，喜欢被包围，喜欢在有人的空间里运转。独处对你来说不是享受，而是“没电了又没法充电”。你最大的优势是感染力，最大的风险是静不下来。`,
    `你几乎是从人群里吸取能量的。没人陪你说话时，你会觉得时间过得很慢。你擅长破冰、擅长热场、擅长把冷掉的局面重新点燃。但你要注意：不是所有问题都能靠“热闹”解决。`,
    `你的外向不只是喜欢社交，而是需要社交。人越多，你越有精神；越安静，你越觉得不对劲。你天生适合需要高频互动的场合，但也要学会忍受必要的孤独。`,
    `你是一个“向外充电”的人。和别人待在一起时，你的状态会被激活；一个人待久了，你会开始蔫。你的优势是社交能量强，劣势是容易忽略内部世界。`,
    `你的 E 比例很高。你习惯先说出来再想清楚，习惯在交流中找答案。这让你显得反应快、好接近。但也要注意：有些答案，必须在安静里才能听见。`,
    `你身上有一种“人多就活”的特质。你能迅速融入任何场合，也能让场面热起来。你的风险在于：你可能用社交填满了所有空隙，以至于没给自己留思考的时间。`,
    `你的能量来源主要在外部。你喜欢说、喜欢动、喜欢和人碰撞。你很少真正无聊，因为你总能找到人一起做点什么。但你也需要偶尔关掉外界，听听自己的声音。`
  ];

  const POOL_EI_MID_E = [
    `你偏向外向。你喜欢与人打交道，善于表达，能从外部世界获得能量，但你并不排斥独处，偶尔的安静能帮你理清思绪。`,
    `你的 E 略高于 I。你在人群里是自在的，但你不会为了社交而社交。你能热闹，也能安静，这让你在多数场合都能适应。`,
    `你偏向外向，但不是那种“必须一直有人陪”的外向。你喜欢互动，也珍惜独处，你的社交是选择，不是刚需。`,
    `你在 E 维度上略占优势。你喜欢表达、喜欢被听见，但你也知道什么时候该收。这种弹性让你不容易在社交里失控。`,
    `你偏向社交型，但不是极端型。你能在聚会里玩得开，也能一个人待得住。你的优势是切换自如，不容易被单一模式困住。`,
    `你的外向是“温和型”的。你喜欢和人在一起，但不会强求热闹。你能在人群中找到自己的位置，也能在安静里安放自己。`

  const POOL_EI_HIGH_I = [
    `你的 I 维度非常突出。独处对你来说是刚需，不是奢侈。人多的场合会让你消耗得很快，你需要长时间安静才能恢复。你的深度思考能力很强，但表达往往慢半拍。`,
    `你几乎是从独处里回血的。社交对你来说是一种支出，不是收入。你不需要很多朋友，你需要的是少数几个真正懂你的人。你的安静不是高冷，是节能。`,
    `你是一个“向内充电”的人。人越多，你越累；越安静，你越清醒。你的优势是专注和深度，劣势是容易被误解为冷淡。`,
    `你的 I 比例很高。你习惯先想清楚再开口，习惯在自己的世界里把问题拆开。这让你显得沉稳、可靠，但也让你在需要快速回应时有点吃亏。`,
    `你在社交里是“低功耗模式”。你能应付，但应付完需要关机一段时间。你不是不喜欢人，你只是不喜欢“一直在线”。`,
    `你的能量主要来自内部。你喜欢安静、喜欢深度、喜欢不被打扰。你的风险是容易把自己关得太久，以至于忘了怎么开门。`,
    `你身上有一种“安静但清醒”的特质。你看得很多，说得很少。你的优势是观察力和思考力，你的功课是学会在需要时开口。`

  const POOL_EI_MID_I = [
    `你偏向内向。你在独处中充电，喜欢安静、深度的交流。你有自己的节奏，不会被外界的喧嚣轻易打乱。`,
    `你的 I 略高于 E。你更喜欢小圈子、深对话，不喜欢无效社交。你能应付热闹，但你不会主动追求热闹。`,
    `你偏向安静型，但不是完全封闭型。你喜欢独处，也愿意为值得的人打开自己。你的社交是精选，不是海选。`,
    `你在 I 维度上略占优势。你喜欢慢节奏、深交流，不太喜欢被推着走。你的优势是专注，劣势是有时太被动。`,
    `你偏向独处型，但不是社恐型。你能在人群里待，但你更愿意待在少数人中间。你需要自己的空间，也需要被理解。`,
    `你的内向是“有分寸”的。你能社交，但社交后需要回血。你不是不喜欢人，你只是不喜欢“一直消耗”。`

  const POOL_SN_HIGH_S = [
    `你的 S 维度非常突出。你关注现实、关注细节、关注“现在到底发生了什么”。你不喜欢空谈，你喜欢能验证的东西。你的优势是落地能力，风险是缺乏对未来的想象。`,
    `你是一个“看得见才相信”的人。抽象概念对你来说太远，具体的、可操作的东西才是你的语言。你做事踏实，但有时会错过更大的图景。`,
    `你的 S 比例很高。你擅长处理具体问题，擅长把事做细、做实。你不喜欢假设，你喜欢证据。你的优势是可靠，劣势是容易被经验绑住。`,
    `你几乎是把“务实”写在脸上的。你关注当下，关注细节，关注可执行性。你不喜欢飘的东西，你喜欢能摸到的东西。`,
    `你是一个“经验派”。你相信过去成功过的方法，也相信一步一步走出来的路。你的执行力很强，但要小心：世界会变，经验会过期。`,
    `你的注意力总在具体的事物上。你能看到细节里的问题，也能把小事做到位。你的优势是稳，风险是容易被细节淹没。`,
    `你身上有一种“脚踏实地”的力量。你不喜欢空想，你喜欢动手。你的优势是落地，你的功课是偶尔抬头看看远方。`

  const POOL_SN_MID_S = [
    `你偏向实感。你关注现实和当下，注重事实和细节。在做事情时，你倾向于按部就班，稳扎稳打。你是一个靠谱的实干家。`,
    `你的 S 略高于 N。你喜欢具体、喜欢可验证的东西。你能处理好眼前的事，也能偶尔想想未来。`,
    `你偏向务实型，但不是死板型。你关注现实，但你不排斥新的可能。你的优势是稳中有变。`,
    `你在 S 维度上略占优势。你喜欢细节、喜欢事实、喜欢能落地的东西。你不太喜欢空谈，但你也知道有些事需要想象。`,

  const POOL_SN_HIGH_N = [
    `你的 N 维度非常突出。你喜欢想、喜欢推演、喜欢在可能性里游走。你不喜欢被细节困住，你喜欢看更大的图景。你的优势是洞察力，风险是落不了地。`,
    `你是一个“活在可能性里”的人。现实对你来说只是起点，你真正感兴趣的是“还可能怎样”。你的创造力很强，但你的执行力需要别人补位。`,
    `你的 N 比例很高。你总能看到别人看不到的联系，总能想到别人想不到的方向。你不喜欢重复，你喜欢新东西。你的优势是创意，劣势是容易飘。`,
    `你几乎是把“想象”写在脸上的。你喜欢概念、喜欢趋势、喜欢“如果……会怎样”。你的优势是视野，功课是把想法落成步骤。`,
    `你是一个“未来感”很强的人。你对还没发生的事比已经发生的事更感兴趣。你的优势是前瞻，风险是忽略当下。`,
    `你的注意力总在更大的图景上。你能从碎片里看到模式，也能从当下看到趋势。你的优势是洞察，功课是别把细节全丢掉。`,
    `你身上有一种“想得很远”的特质。你喜欢讨论意义、讨论可能性、讨论还没发生的事。你的优势是视野，功课是落地。`

  const POOL_SN_MID_N = [
    `你偏向直觉。你喜欢探索未来的可能性，富有想象力。你不满足于表面的现象，总是想挖掘事物背后的深层意义。你适合从事需要创意和洞察力的工作。`,
    `你的 N 略高于 S。你喜欢想、喜欢推演、喜欢看背后的东西。你也能处理具体事务，但你更享受抽象层面的讨论。`,
    `你偏向想象型，但不是漂浮型。你喜欢概念、喜欢趋势，但你也知道什么时候该回到现实。`,
    `你在 N 维度上略占优势。你喜欢可能性、喜欢新方向、喜欢“还有没有别的解法”。你的优势是创意，功课是落地。`,
    `你偏向未来型，但不是空想型。你能看到更大的图景，也愿意为它做具体的事。你的优势是方向感。`,
    `你的注意力更多在未来和可能性上。你喜欢讨论意义、讨论趋势，但你也知道有些事必须现在就做。`

  const POOL_TF_HIGH_T = [
    `你的 T 维度非常突出。你做决定靠逻辑、靠证据、靠利弊分析。你不喜欢情绪化的表达，你喜欢清晰的对错。你的优势是清醒，风险是显得不近人情。`,
    `你是一个“讲道理”的人。你能把复杂问题拆成因果链，也能在混乱里找到秩序。你的优势是判断力，功课是学会照顾情绪。`,
    `你的 T 比例很高。你更相信逻辑，而不是感觉。你能在压力下保持冷静，但你也要小心：不是所有问题都能靠道理解决。`,
    `你几乎是把“理性”当默认设置的人。你喜欢证据、喜欢分析、喜欢把事情说清楚。你的优势是清醒，功课是柔软一点。`,
    `你是一个“先算账再动情”的人。你能把利弊看得清楚，也能在关键时刻做冷静选择。你的优势是理性，风险是容易伤到人。`,
    `你的注意力更多在“对不对”上，而不是“舒不舒服”上。你擅长判断，擅长分析，擅长把问题拆开。你的功课是别把感情当成噪音。`,
    `你身上有一种“冷静”的力量。你能在情绪里抽身，也能在混乱里看清。你的优势是判断力，功课是别让自己太硬。`

  const POOL_TF_MID_T = [
    `你偏向理性。你讲究客观和公平，善于分析利弊。你能理性地看待问题，不容易被情绪左右。`,
    `你的 T 略高于 F。你喜欢讲道理，喜欢把问题说清楚。你也能照顾情绪，但你更相信逻辑。`,

    `你偏向理性型，但不是无情型。你能算账，也能体谅。你的优势是清醒中带温度。`,

  const POOL_TF_HIGH_F = [
    `你的 F 维度非常突出。你做决定先看感受、看关系、看人的处境。你不喜欢冷冰冰的道理，你喜欢有温度的处理。你的优势是共情，风险是被消耗。`,
    `你是一个“先照顾人”的人。你能感觉到别人没说出口的情绪，也愿意为关系做让步。你的优势是温度，功课是别把自己丢进去。`,
    `你的 F 比例很高。你更容易被情绪牵动，也更容易在关系里付出过多。你的优势是温柔，功课是守住边界。`,

  // ============================================================
  // 核心逻辑
  // ============================================================
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQuestions(base, count) {
    let pool = base.slice();
    if (pool.length < count) {
      const extra = [];
      let i = 0;
      while (pool.length + extra.length < count) {
        const q = base[i % base.length];
        extra.push({ text: "换个角度：" + q.text, options: q.options.map(o => ({ label: o.label, value: o.value })) });
        i++;
      }
      pool = pool.concat(extra);
    }
    return shuffle(pool).slice(0, count).map(q => ({
      text: q.text,
      options: shuffle(q.options).map(o => ({ label: o.label, value: o.value }))
    }));
  }

  function getVersionQuestions(version) {
    if (version === 40) return prepareQuestions(SIMPLE_BASE, 40);
    if (version === 100) return prepareQuestions(NORMAL_BASE, 100);
    return prepareQuestions(DEEP_BASE, 200);
  }

  let currentVersion = 40;
  let questions = [];
  let currentQuestionIndex = 0;
  let answers = [];

  const quizArea = document.getElementById('quizArea');
  const resultArea = document.getElementById('resultArea');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resultType = document.getElementById('resultType');
  const resultTitle = document.getElementById('resultTitle');
  const resultTagline = document.getElementById('resultTagline');
  const dimsBar = document.getElementById('dimsBar');
  const resultDesc = document.getElementById('resultDesc');
  const restartBtn = document.getElementById('restartBtn');
  const mainHistoryToggle = document.getElementById('mainHistoryToggle');
  const mainHistorySection = document.getElementById('mainHistorySection');
  const mainHistoryList = document.getElementById('mainHistoryList');
  const mainHistoryClear = document.getElementById('mainHistoryClear');
  const versionTabs = document.querySelectorAll('.version-tab');

  function resetState(version) {
    currentVersion = version;
    questions = getVersionQuestions(version);
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    quizArea.classList.remove('hidden');
    resultArea.classList.add('hidden');
    versionTabs.forEach(tab => {
      tab.classList.toggle('active', parseInt(tab.dataset.version) === version);
    });
    renderQuestion();
  }

  function updateProgress() {
    const total = questions.length;
    const answered = answers.filter(a => a !== null).length;
    progressFill.style.width = (answered / total) * 100 + '%';
    counter.textContent = (currentQuestionIndex + 1) + ' / ' + total;
  }

  function renderQuestion() {
    const q = questions[currentQuestionIndex];
    questionText.textContent = q.text;
    const saved = answers[currentQuestionIndex];
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if (saved !== null && saved === opt.value) btn.classList.add('selected');
      btn.innerHTML = '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span>' + opt.label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        answers[currentQuestionIndex] = opt.value;
        updateProgress();
        updateNavButtons();
      });
      optionsContainer.appendChild(btn);
    });
    updateProgress();
    updateNavButtons();
  }

  function updateNavButtons() {
    prevBtn.disabled = currentQuestionIndex === 0;
    nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? '查看结果' : '下一题';
    const has = answers[currentQuestionIndex] !== null;
    if (!has && currentQuestionIndex < questions.length - 1) nextBtn.disabled = true;
    else nextBtn.disabled = false;
  }

  function goToNext() {
    if (currentQuestionIndex < questions.length - 1) {
      if (answers[currentQuestionIndex] === null) return;
      currentQuestionIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function goToPrev() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderQuestion();
    }
  }

  function calculateVariant(counts) {
    const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
    const e = counts.E >= counts.I ? 'E' : 'I';
    const s = counts.S >= counts.N ? 'S' : 'N';
    const t = counts.T >= counts.F ? 'T' : 'F';
    const j = counts.J >= counts.P ? 'J' : 'P';
    const type = e + s + t + j;
    let suffix = '';
    if (counts[e] / total > 0.7) suffix += e;
    if (counts[s] / total > 0.7) suffix += s;
    if (counts[t] / total > 0.7) suffix += t;
    if (counts[j] / total > 0.7) suffix += j;
    if (suffix.length === 0) suffix = 'A';
    else if (suffix.length === 4) suffix = 'T';
    return type + '-' + suffix;
  }

  function calculate() {
    const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    answers.forEach(v => { if (v && counts.hasOwnProperty(v)) counts[v]++; });
    const variant = calculateVariant(counts);
    return { variant, type: variant.substring(0, 4), counts };
  }

  function renderDims(counts) {
    const totalEI = (counts.E + counts.I) || 1;
    const totalSN = (counts.S + counts.N) || 1;
    const totalTF = (counts.T + counts.F) || 1;
    const totalJP = (counts.J + counts.P) || 1;
    const dims = [
      { left: 'E', right: 'I', l: (counts.E / totalEI) * 100 },
      { left: 'S', right: 'N', l: (counts.S / totalSN) * 100 },
      { left: 'T', right: 'F', l: (counts.T / totalTF) * 100 },
      { left: 'J', right: 'P', l: (counts.J / totalJP) * 100 }
    ];
    dimsBar.innerHTML = dims.map(d => (
      '<div class="dim-row">' +
        '<span class="dim-label">' + d.left + ' ' + d.right + '</span>' +
        '<div class="dim-track">' +
          '<div class="dim-fill-left" style="width:' + d.l + '%"></div>' +
          '<div class="dim-fill-right" style="width:' + (100 - d.l) + '%"></div>' +
        '</div>' +
        '<span class="dim-pct">' + Math.round(d.l) + '%</span>' +
      '</div>'
    )).join('');
  }

  // ============================================================
  // 解析生成（只输出表人格，按版本深浅不同）
  // ============================================================
  function generateDetailedText(type, variant, counts, version) {
    const info = TYPE_DESC[type] || { title: '探索者', tag: '独特的人格组合' };
    const pE = Math.round((counts.E / (counts.E + counts.I || 1)) * 100) || 0;
    const pI = 100 - pE;
    const pS = Math.round((counts.S / (counts.S + counts.N || 1)) * 100) || 0;
    const pN = 100 - pS;
    const pT = Math.round((counts.T / (counts.T + counts.F || 1)) * 100) || 0;
    const pF = 100 - pT;
    const pJ = Math.round((counts.J / (counts.J + counts.P || 1)) * 100) || 0;
    const pP = 100 - pJ;

    const used = new Set();
    const fill = (tpl) => tpl
      .replace(/{type}/g, type)
      .replace(/{variant}/g, variant)
      .replace(/{title}/g, info.title)
      .replace(/{tag}/g, info.tag);

    let html = `<h3>【基础画像】你是 ${variant}</h3>`;
    const intro = pickRandom(POOL_INTRO, used);
    html += `<p>${fill(intro)}</p>`;

    // 能量维度
    html += `<h3>【能量源】E/I 维度（外向 ${pE}% : 内向 ${pI}%）</h3>`;
    let eiPool;
    if (pE >= 80) eiPool = POOL_EI_HIGH_E;
    else if (pE >= 60) eiPool = POOL_EI_MID_E;
    else if (pI >= 80) eiPool = POOL_EI_HIGH_I;
    else eiPool = POOL_EI_MID_I;
    const ei = pickRandom(eiPool, used);
    if (ei) html += `<p>${fill(ei)}</p>`;

    // 信息维度
    html += `<h3>【信息雷达】S/N 维度（实感 ${pS}% : 直觉 ${pN}%）</h3>`;
    let snPool;
    if (pS >= 80) snPool = POOL_SN_HIGH_S;
    else if (pS >= 60) snPool = POOL_SN_MID_S;
    else if (pN >= 80) snPool = POOL_SN_HIGH_N;
    else snPool = POOL_SN_MID_N;
    const sn = pickRandom(snPool, used);
    if (sn) html += `<p>${fill(sn)}</p>`;

    // 决策维度
    html += `<h3>【决策天平】T/F 维度（思考 ${pT}% : 情感 ${pF}%）</h3>`;
    let tfPool;
    if (pT >= 80) tfPool = POOL_TF_HIGH_T;
    else if (pT >= 60) tfPool = POOL_TF_MID_T;
    else if (pF >= 80) tfPool = POOL_TF_HIGH_F;
    else tfPool = POOL_TF_MID_F;
    const tf = pickRandom(tfPool, used);
    if (tf) html += `<p>${fill(tf)}</p>`;

    // 生活维度
    html += `<h3>【生活节奏】J/P 维度（判断 ${pJ}% : 知觉 ${pP}%）</h3>`;
    let jpPool;
    if (pJ >= 80) jpPool = POOL_JP_HIGH_J;
    else if (pJ >= 60) jpPool = POOL_JP_MID_J;
    else if (pP >= 80) jpPool = POOL_JP_HIGH_P;
    else jpPool = POOL_JP_MID_P;
    const jp = pickRandom(jpPool, used);
    if (jp) html += `<p>${fill(jp)}</p>`;

    // 亲密关系
    html += `<h3>【亲密关系】如何爱与被爱</h3>`;
    const rel = pickRandom(POOL_RELATION, used);
    if (rel) html += `<p>${fill(rel)}</p>`;

    // 职场
    html += `<h3>【职场生存】你的优势与破局</h3>`;
    const work = pickRandom(POOL_WORK, used);
    if (work) html += `<p>${fill(work)}</p>`;

    // 40题极简版到此收尾
    if (version === 40) {
      const short = pickRandom(POOL_SHORT, used);
      if (short) html += `<p>${fill(short)}</p>`;
      return html;
    }

    // 成长总结
    html += `<h3>【终极命题】你的成长与破局之路</h3>`;
    const growth = pickRandom(POOL_GROWTH, used);
    if (growth) html += `<p>${fill(growth)}</p>`;
    const advice = pickRandom(POOL_ADVICE, used);
    if (advice) html += `<p>${fill(advice)}</p>`;

    if (version === 100) {
      const short = pickRandom(POOL_SHORT, used);
      if (short) html += `<p>${fill(short)}</p>`;
      return html;
    }

    // 200题深度思考版：追加压力模式与关系深化
    html += `<h3>【压力模式】你在高压下的真实反应</h3>`;
    html += `<p>你在压力下最容易出现的反应，是把你最擅长的那一面用到过头。你越焦虑，越会回到你最熟悉的功能里，结果反而把自己困住。你需要练习在压力下切换：不是用更多同一种方式去硬扛，而是试着调用你平时最少用的那一面。</p>`;
    if (pE >= 60) {
      html += `<p>你的压力出口在“向外”：你会找人说话、找人确认、找人陪。但真正让你恢复的，往往是先安静下来，把问题拆开。你需要在压力下允许自己先独处一会儿。</p>`;
    } else {
      html += `<p>你的压力出口在“向内”：你会关起来、自己消化、不麻烦别人。但真正让你恢复的，往往是先把话说出来。你需要在压力下允许自己求助一次。</p>`;
    }
    if (pN >= 60) {
      html += `<p>你在压力下容易越想越远，把一个小问题推演成一个大灾难。你需要练习把注意力拉回当下，先处理眼前这一件事。</p>`;
    } else {
      html += `<p>你在压力下容易只盯着细节，反复检查、反复确认。你需要练习抬头看一眼全局，确认方向有没有偏。</p>`;
    }

    html += `<h3>【关系深化】你在关系里最容易忽略的东西</h3>`;
    if (pF >= 60) {
      html += `<p>你在关系里最容易忽略的是自己的需要。你太擅长照顾别人，以至于别人也忘了你也会累。你需要练习把“我想要”说出口，而不是等对方猜。</p>`;
    } else {
      html += `<p>你在关系里最容易忽略的是对方的情绪。你太擅长讲道理，以至于对方要的是被理解，不是被纠正。你需要练习在讲道理之前，先接住情绪。</p>`;
    }
    if (pJ >= 60) {
      html += `<p>你在关系里容易把“安排好”当成“在乎”。但有时候对方要的不是计划，是陪伴。你需要允许关系里有一些没有安排的时间。</p>`;
    } else {
      html += `<p>你在关系里容易把“随性”当成“自由”。但有时候对方要的不是空间，是确定。你需要允许关系里有一些明确的承诺。</p>`;
    }

    html += `<h3>【长期成长】从表人格走向更完整的自己</h3>`;
    html += `<p>你的表人格是你最熟练的那套系统。它帮你走到今天，也限制你走到更远。真正的成长，不是抛弃它，而是在需要的时候，能调用另一套系统。你不需要变成另一个人，你只需要变得更灵活。</p>`;
    html += `<p>你可以从一个小动作开始：每周做一件“不像你”的事。如果你习惯热闹，就安静一天；如果你习惯独处，就主动约一次人；如果你习惯讲道理，就先接一次情绪；如果你习惯随性，就认真做一次计划。你会发现，那些“不像你”的部分，也是你的一部分。</p>`;

    const short = pickRandom(POOL_SHORT, used);
    if (short) html += `<p>${fill(short)}</p>`;

    return html;
  }

  // ============================================================
  // 历史记录
  // ============================================================
  function saveToHistory(variant, version, counts, descHtml) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    history.unshift({ variant, version, counts, descHtml, time: new Date().toLocaleString('zh-CN') });
    if (history.length > 20) history = history.slice(0, 20);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function renderHistory() {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    if (!history.length) {
      mainHistoryList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }
    mainHistoryList.innerHTML = history.map((h, index) => (
      '<div class="history-item" onclick="window.viewHistoryItem(' + index + ')">' +
        '<span class="h-type">' + h.variant + ' <span style="font-size:0.8rem;font-weight:normal;color:#6b7d8f;">(' + h.version + '题)</span></span>' +
        '<span class="h-meta">' + h.time + ' 点击查看解析</span>' +
      '</div>'
    )).join('');
  }

  window.viewHistoryItem = function(index) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    const item = history[index];
    if (!item) return;
    const info = TYPE_DESC[item.variant.substring(0, 4)] || { title: '探索者', tag: '独特的人格组合' };
    resultType.textContent = item.variant;
    resultTitle.textContent = info.title;
    resultTagline.textContent = info.tag;
    renderDims(item.counts);
    resultDesc.innerHTML = item.descHtml;
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    mainHistorySection.classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // ============================================================
  // 结果展示
  // ============================================================
  function showResult() {
    if (answers.some(a => a === null)) {
      for (let i = 0; i < answers.length; i++) {
        if (answers[i] === null) {
          currentQuestionIndex = i;
          renderQuestion();
          return;
        }
      }
    }
    const { type, variant, counts } = calculate();
    const info = TYPE_DESC[type] || { title: '探索者', tag: '独特的人格组合' };
    resultType.textContent = variant;
    resultTitle.textContent = info.title;
    resultTagline.textContent = info.tag;
    renderDims(counts);
    const descHtml = generateDetailedText(type, variant, counts, currentVersion);
    resultDesc.innerHTML = descHtml;
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    saveToHistory(variant, currentVersion, counts, descHtml);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restartTest() {
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    resultArea.classList.add('hidden');
    quizArea.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============================================================
  // 事件绑定
  // ============================================================
  versionTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const v = parseInt(tab.dataset.version);
      if (v !== currentVersion) resetState(v);
    });
  });

  nextBtn.addEventListener('click', goToNext);
  prevBtn.addEventListener('click', goToPrev);
  restartBtn.addEventListener('click', restartTest);

  mainHistoryToggle.addEventListener('click', () => {
    if (mainHistorySection.classList.contains('hidden')) {
      renderHistory();
      mainHistorySection.classList.remove('hidden');
    } else {
      mainHistorySection.classList.add('hidden');
    }
  });

  mainHistoryClear.addEventListener('click', () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderHistory();
  });

  // ============================================================
  // 启动
  // ============================================================
  resetState(40);
})();
</script>
</body>
</html>
