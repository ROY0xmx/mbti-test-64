<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>MBTI 64人格 · 三阶深度测试</title>
<style>

  body { background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; color-scheme: light only; }
  .test-container { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); padding: 40px 35px; max-width: 800px; width: 100%; border: 1px solid #eaeaea; }

  .version-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; flex: 1; }

  .version-tab:hover { background: #fff; border-color: #1e3c5a; }
  .version-tab.active { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .version-tab .badge { display: inline-block; background: #eef1f4; color: #0b2b4a; font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 30px; margin-left: 6px; }
  .version-tab.active .badge { background: #fff; color: #0b2b4a; }
  .history-toggle { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 0.95rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; white-space: nowrap; }
  .history-toggle:hover { background: #fff; border-color: #1e3c5a; }
  .history-section { margin-bottom: 22px; border: 1px solid #eaeaea; background: #f9fafb; border-radius: 18px; padding: 16px 18px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #0b2b4a; font-weight: 600; font-size: 1rem; }
  .history-clear { background: none; border: none; color: #4a5b6b; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
  .history-item { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .history-item .h-type { font-weight: 700; color: #0b2b4a; font-size: 0.95rem; }
  .history-item .h-meta { font-size: 0.8rem; color: #6b7d8f; }
  .history-empty { color: #8a9aa8; font-size: 0.9rem; padding: 4px 0; }
  .progress-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-weight: 500; gap: 8px; flex-wrap: wrap; }
  .question-counter { background: #f0f2f4; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; color: #0b2b4a; border: 1px solid #d6dde3; white-space: nowrap; }
  .progress-bar-bg { flex-grow: 1; min-width: 100px; height: 8px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 8px; background: #1e3c5a; width: 0%; border-radius: 10px; transition: width .15s ease; }
  .question-text { font-size: clamp(1.05rem, 4vw, 1.4rem); font-weight: 500; color: #0b2b4a; line-height: 1.45; margin-bottom: 26px; min-height: 70px; display: flex; align-items: center; }
  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
  .option-btn { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 16px; padding: 14px 18px; font-size: clamp(0.9rem, 3.2vw, 1rem); font-weight: 500; color: #1e3c5a; text-align: left; cursor: pointer; transition: all .1s ease; display: flex; align-items: flex-start; line-height: 1.45; word-break: break-word; }
  .option-btn:hover { background: #fff; border-color: #1e3c5a; box-shadow: 0 4px 12px rgba(0,20,40,.06); }
  .option-btn.selected { background: #fff; border-color: #1e3c5a; border-width: 2px; box-shadow: 0 4px 14px rgba(20,50,80,.1); }
  .option-letter { display: inline-block; width: 24px; height: 24px; background: #eef1f4; border-radius: 50%; text-align: center; line-height: 24px; font-size: 0.8rem; font-weight: 600; color: #0b2b4a; margin-right: 12px; flex-shrink: 0; margin-top: 1px; }
  .option-btn.selected .option-letter { background: #1e3c5a; color: #fff; }
  .nav-buttons { display: flex; justify-content: space-between; gap: 12px; }
  .nav-btn { background: #fff; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 11px 26px; font-size: clamp(0.9rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; flex: 1; }
  .nav-btn:hover:not(:disabled) { background: #f0f4f8; border-color: #1e3c5a; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-btn.primary { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .nav-btn.primary:hover:not(:disabled) { background: #0b2b4a; border-color: #0b2b4a; }
  .result-screen { padding: 10px 0 6px; }
  .result-header { text-align: center; margin-bottom: 8px; }
  .result-type { font-size: clamp(2.4rem, 12vw, 4.2rem); font-weight: 700; color: #0b2b4a; letter-spacing: 2px; line-height: 1.1; margin-bottom: 10px; }
  .result-title { font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 500; color: #1e3c5a; margin-bottom: 6px; }
  .result-tagline { font-size: clamp(0.9rem, 3vw, 1rem); color: #4a5b6b; margin-bottom: 22px; }
  .dims-bar { display: flex; flex-direction: column; gap: 10px; background: #f9fafb; border: 1px solid #eaeaea; border-radius: 18px; padding: 16px 18px; margin-bottom: 26px; }
  .dim-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #1e3c5a; }
  .dim-label { width: 46px; font-weight: 600; color: #0b2b4a; text-align: center; font-size: 0.8rem; flex-shrink: 0; }
  .dim-track { flex-grow: 1; min-width: 60px; height: 18px; background: #e9ecef; border-radius: 20px; overflow: hidden; display: flex; }
  .dim-fill-left { height: 100%; background: #1e3c5a; }
  .dim-fill-right { height: 100%; background: #b0c4d4; }
  .dim-pct { width: 40px; text-align: right; font-weight: 500; color: #1e3c5a; font-size: 0.8rem; flex-shrink: 0; }
  .result-desc { font-size: clamp(0.9rem, 3.2vw, 1rem); color: #3f5567; line-height: 1.75; margin-bottom: 26px; border-top: 1px solid #e0e0e0; padding-top: 22px; }
  .result-desc p { margin-bottom: 14px; }
  .result-desc h3 { font-size: 1.05rem; color: #0b2b4a; margin: 20px 0 10px; font-weight: 600; }
  .result-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .restart-btn { background: #fff; border: 1.5px solid #1e3c5a; border-radius: 40px; padding: 13px 36px; font-size: clamp(0.95rem, 3vw, 1.05rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }
  .restart-btn:hover { background: #1e3c5a; color: #fff; }
  .hidden { display: none; }
  @media (max-width: 560px) {
    body { padding: 0; }
    .test-container { border-radius: 0; border: none; box-shadow: none; padding: 20px 16px 30px; min-height: 100vh; }
    .top-bar { flex-direction: row; align-items: center; }
    .version-tabs { justify-content: flex-start; gap: 8px; }
    .version-tab { padding: 7px 14px; }
    .history-toggle { padding: 7px 14px; align-self: center; }
    .question-text { min-height: 60px; }
    .option-btn { padding: 12px 14px; }
    .option-letter { width: 22px; height: 22px; line-height: 22px; font-size: 0.75rem; margin-right: 10px; }
    .nav-btn { padding: 11px 16px; }
    .dims-bar { padding: 14px 14px; }
    .result-desc { padding-top: 18px; }
  }
  @media (max-width: 380px) {
    .version-tab .badge { display: none; }
    .dim-label { width: 38px; font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div class="test-container">
  <h1>MBTI · 64人格细分</h1>
  <div class="subhead">16型人格亚型 · 三阶深度探索</div>

  <div class="top-bar">
    <div class="version-tabs">
      <button class="version-tab active" data-version="40">极简版 <span class="badge">40题</span></button>
      <button class="version-tab" data-version="100">普通版 <span class="badge">100题</span></button>
      <button class="version-tab" data-version="200">深度思考版 <span class="badge">200题</span></button>
    </div>
    <button class="history-toggle" id="mainHistoryToggle">历史记录</button>
  </div>

  <div class="history-section hidden" id="mainHistorySection">
    <div class="history-header">
      <span>测试历史</span>
      <button class="history-clear" id="mainHistoryClear">清空</button>
    </div>
    <div class="history-list" id="mainHistoryList"></div>
  </div>

  <div id="quizArea">
    <div class="progress-area">
      <span class="question-counter" id="counter">1 / 40</span>
      <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
    </div>
    <div class="question-text" id="questionText">正在加载...</div>
    <div class="options" id="optionsContainer"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" disabled>上一题</button>
      <button class="nav-btn primary" id="nextBtn">下一题</button>
    </div>
  </div>

  <div id="resultArea" class="result-screen hidden">
    <div class="result-header">
      <div class="result-type" id="resultType">INFP-A</div>
      <div class="result-title" id="resultTitle">调停者</div>
      <div class="result-tagline" id="resultTagline"></div>
    </div>
    <div class="dims-bar" id="dimsBar"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-actions">
      <button class="restart-btn" id="restartBtn">重新测试</button>
    </div>
  </div>
</div>

      { t: "你认为更重要的是：", a: [{ l: "公平", v: "T" }, { l: "仁慈", v: "F" }, { l: "规则面前人人平等", v: "T" }, { l: "体谅每个人的难处", v: "F" }] },
      { t: "你更享受：", a: [{ l: "完成一个长期计划", v: "J" }, { l: "探索多个新的可能", v: "P" }, { l: "按部就班推进目标", v: "J" }, { l: "同时尝试不同方向", v: "P" }] },
      { t: "你更容易：", a: [{ l: "在人群中感到兴奋", v: "E" }, { l: "在独处中恢复精力", v: "I" }, { l: "通过交流理清思路", v: "E" }, { l: "通过沉思获得答案", v: "I" }] },
      { t: "你更依赖：", a: [{ l: "经验和事实", v: "S" }, { l: "灵感和直觉", v: "N" }, { l: "过去成功的做法", v: "S" }, { l: "内心的指引", v: "N" }] },
      { t: "你更看重：", a: [{ l: "逻辑的严密性", v: "T" }, { l: "情感的真诚性", v: "F" }, { l: "论证是否合理", v: "T" }, { l: "是否发自内心", v: "F" }] },
      { t: "你更倾向于：", a: [{ l: "按计划行事", v: "J" }, { l: "保持开放选项", v: "P" }, { l: "提前确定目标", v: "J" }, { l: "走一步看一步", v: "P" }] },
      { t: "你更喜欢：", a: [{ l: "成为焦点", v: "E" }, { l: "做幕后的支持者", v: "I" }, { l: "在台前表达观点", v: "E" }, { l: "在背后默默付出", v: "I" }] },
      { t: "你更容易注意到：", a: [{ l: "事物的实际用途", v: "S" }, { l: "事物背后的意义", v: "N" }, { l: "具体的使用方法", v: "S" }, { l: "象征和隐喻", v: "N" }] },
      { t: "你更愿意：", a: [{ l: "用逻辑说服别人", v: "T" }, { l: "用情感打动别人", v: "F" }, { l: "摆事实讲道理", v: "T" }, { l: "讲故事引发共鸣", v: "F" }] },
      { t: "你更享受：", a: [{ l: "按部就班的稳定", v: "J" }, { l: "灵活多变的自由", v: "P" }, { l: "清晰的规则和节奏", v: "J" }, { l: "随性的节奏和空间", v: "P" }] },
      { t: "你更认同：", a: [{ l: "行动胜于言语", v: "E" }, { l: "思考胜于行动", v: "I" }, { l: "多交流才能碰撞火花", v: "E" }, { l: "安静思考才能深入", v: "I" }] }
    ];

    const branchPrefixes = [
      "当事情进展顺利时，", "当事情陷入僵局时，", "在压力很大的时候，",
      "面对陌生人的时候，", "和家人相处的时候，", "独自做重要选择时，",
      "被别人误解时，", "获得意外机会时，", "需要妥协的时候，",
      "回顾过去的时候，", "想象未来的时候，", "在人群中感到疲惫时，",
      "需要快速反应时，", "需要长期坚持时，", "面对规则的时候，",
      "面对情感冲突时，", "在兴趣和现实之间，", "当朋友求助时，",
      "当计划被打乱时，", "当获得认可时"
    ];

    let idx = 0;
    while (result.length < 200) {
      const tpl = templates[idx % templates.length];
      const round = Math.floor(idx / templates.length);
      let prefix = "";
      if (round < branchPrefixes.length) {
        prefix = branchPrefixes[round];
      } else {
        prefix = "在更深层的情境中（" + (round + 1) + "）：";
      }
      result.push({
        text: prefix + tpl.t,
        options: tpl.a.map(o => ({ label: o.l, value: o.v }))
      });
      idx++;
    }
    return result;
  })();

  const TYPE_DESC = {
    INTJ: { title: "建筑师", tag: "战略性的独立思考者" },
    INTP: { title: "逻辑学家", tag: "无止境的知识探索者" },
    ENTJ: { title: "指挥官", tag: "天生的目标推动者" },
    ENTP: { title: "辩论家", tag: "永不疲倦的灵感火花" },
    INFJ: { title: "提倡者", tag: "安静而坚定的理想主义者" },
    INFP: { title: "调停者", tag: "温柔而丰富的内心世界" },
    ENFJ: { title: "主人公", tag: "鼓舞人心的凝聚力核心" },
    ENFP: { title: "竞选者", tag: "热情洋溢的可能性探索者" },
    ISTJ: { title: "物流师", tag: "可靠踏实的秩序守护者" },
    ISFJ: { title: "守卫者", tag: "细致入微的温暖守护者" },
    ESTJ: { title: "总经理", tag: "务实高效的组织者" },
    ESFJ: { title: "执政官", tag: "热心周到的关系维系者" },
    ISTP: { title: "鉴赏家", tag: "冷静灵活的问题解决者" },
    ISFP: { title: "探险家", tag: "敏感而自由的生活美学家" },
    ESTP: { title: "企业家", tag: "精力充沛的行动派" },
    ESFP: { title: "表演者", tag: "热情洋溢的当下享受者" }
  };

  const STORAGE_KEY = 'mbti_64_history_v1';

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQuestions(base, count) {
    let pool = base.slice();
    if (pool.length < count) {
      const extra = [];
      let i = 0;
      while (pool.length + extra.length < count) {
        const q = base[i % base.length];
        extra.push({
          text: "换个角度：" + q.text,
          options: q.options.map(o => ({ label: o.label, value: o.value }))
        });
        i++;
      }
      pool = pool.concat(extra);
    }
    const shuffled = shuffle(pool).slice(0, count);
    return shuffled.map(q => ({
      text: q.text,
      options: shuffle(q.options).map(o => ({ label: o.label, value: o.value }))
    }));
  }

  function getVersionQuestions(version) {
    if (version === 40) return prepareQuestions(SIMPLE_BASE, 40);
    if (version === 100) return prepareQuestions(NORMAL_BASE, 100);
    return prepareQuestions(DEEP_BASE, 200);
  }

  let currentVersion = 40;
  let questions = [];
  let currentQuestionIndex = 0;
  let answers = [];

  const quizArea = document.getElementById('quizArea');
  const resultArea = document.getElementById('resultArea');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resultType = document.getElementById('resultType');
  const resultTitle = document.getElementById('resultTitle');
  const resultTagline = document.getElementById('resultTagline');
  const dimsBar = document.getElementById('dimsBar');
  const resultDesc = document.getElementById('resultDesc');
  const restartBtn = document.getElementById('restartBtn');
  const mainHistoryToggle = document.getElementById('mainHistoryToggle');
  const mainHistorySection = document.getElementById('mainHistorySection');
  const mainHistoryList = document.getElementById('mainHistoryList');
  const mainHistoryClear = document.getElementById('mainHistoryClear');
  const versionTabs = document.querySelectorAll('.version-tab');

  function resetState(version) {
    currentVersion = version;
    questions = getVersionQuestions(version);
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    quizArea.classList.remove('hidden');
    resultArea.classList.add('hidden');
    versionTabs.forEach(tab => {
      tab.classList.toggle('active', parseInt(tab.dataset.version) === version);
    });
    renderQuestion();
  }

  function updateProgress() {
    const total = questions.length;
    const answered = answers.filter(a => a !== null).length;
    progressFill.style.width = (answered / total) * 100 + '%';
    counter.textContent = (currentQuestionIndex + 1) + ' / ' + total;
  }

  function renderQuestion() {
    const q = questions[currentQuestionIndex];
    questionText.textContent = q.text;
    const saved = answers[currentQuestionIndex];
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if (saved !== null && saved === opt.value) btn.classList.add('selected');
      btn.innerHTML = '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span>' + opt.label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        answers[currentQuestionIndex] = opt.value;
        updateProgress();
        updateNavButtons();
      });
      optionsContainer.appendChild(btn);
    });
    updateProgress();
    updateNavButtons();
  }

  function updateNavButtons() {
    prevBtn.disabled = currentQuestionIndex === 0;
    nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? '查看结果' : '下一题';
    const has = answers[currentQuestionIndex] !== null;
    if (!has && currentQuestionIndex < questions.length - 1) nextBtn.disabled = true;
    else nextBtn.disabled = false;
  }

  function goToNext() {
    if (currentQuestionIndex < questions.length - 1) {
      if (answers[currentQuestionIndex] === null) return;
      currentQuestionIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function goToPrev() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderQuestion();
    }
  }

  function calculate() {
    const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    answers.forEach(v => { if (v && counts.hasOwnProperty(v)) counts[v]++; });
    
    const total = answers.length;
    
    const e = counts.E >= counts.I ? 'E' : 'I';
    const s = counts.S >= counts.N ? 'S' : 'N';
    const t = counts.T >= counts.F ? 'T' : 'F';
    const j = counts.J >= counts.P ? 'J' : 'P';
    
    let suffix = '';
    if (e === 'E' && counts.E / total > 0.7) suffix += 'E';
    if (e === 'I' && counts.I / total > 0.7) suffix += 'I';
    if (s === 'S' && counts.S / total > 0.7) suffix += 'S';
    if (s === 'N' && counts.N / total > 0.7) suffix += 'N';
    if (t === 'T' && counts.T / total > 0.7) suffix += 'T';
    if (t === 'F' && counts.F / total > 0.7) suffix += 'F';
    if (j === 'J' && counts.J / total > 0.7) suffix += 'J';
    if (j === 'P' && counts.P / total > 0.7) suffix += 'P';
    
    if (suffix.length === 0) {
      suffix = 'A';
    } else if (suffix.length === 4) {
      suffix = 'T';
    }
    
    const type = e + s + t + j;
    return { type, variant: type + '-' + suffix, counts };
  }

  function renderDims(counts) {
    const totalEI = counts.E + counts.I || 1;
    const totalSN = counts.S + counts.N || 1;
    const totalTF = counts.T + counts.F || 1;
    const totalJP = counts.J + counts.P || 1;
    const dims = [
      { left: 'E', right: 'I', l: (counts.E / totalEI) * 100 },
      { left: 'S', right: 'N', l: (counts.S / totalSN) * 100 },
      { left: 'T', right: 'F', l: (counts.T / totalTF) * 100 },
      { left: 'J', right: 'P', l: (counts.J / totalJP) * 100 }
    ];
    dimsBar.innerHTML = dims.map(d => (
      '<div class="dim-row">' +
        '<span class="dim-label">' + d.left + ' ' + d.right + '</span>' +
        '<div class="dim-track">' +
          '<div class="dim-fill-left" style="width:' + d.l + '%"></div>' +
          '<div class="dim-fill-right" style="width:' + (100 - d.l) + '%"></div>' +
        '</div>' +
        '<span class="dim-pct">' + Math.round(d.l) + '%</span>' +
      '</div>'
    )).join('');
  }

  function saveToHistory(variant, version, counts) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    history.unshift({
      variant,
      version,
      counts,
      time: new Date().toLocaleString('zh-CN')
    });
    if (history.length > 20) history = history.slice(0, 20);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function renderHistory() {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    if (!history.length) {
      mainHistoryList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }
    mainHistoryList.innerHTML = history.map(h => (
      '<div class="history-item">' +
        '<span class="h-type">' + h.variant + '</span>' +
        '<span class="h-meta">' + h.version + '题 · ' + h.time + '</span>' +
      '</div>'
    )).join('');
  }

  function showResult() {
    if (answers.some(a => a === null)) {
      for (let i = 0; i < answers.length; i++) {
        if (answers[i] === null) {
          currentQuestionIndex = i;
          renderQuestion();
          return;
        }
      }
    }
    const { type, variant, counts } = calculate();
    const info = TYPE_DESC[type] || { title: '探索者', tag: '独特的人格组合' };
    resultType.textContent = variant;
    resultTitle.textContent = info.title;
    resultTagline.textContent = info.tag;
    renderDims(counts);
    
    let variantDesc = '';
    if (variant.endsWith('-A')) {
      variantDesc = '你在四个维度上的倾向相对均衡，没有某一项表现出极端的偏好。这让你在不同情境下都能游刃有余，但也可能让你在做决定时感到纠结。你是一个「适应型」的变体，擅长在多变的环境中找到平衡。';
    } else if (variant.endsWith('-T')) {
      variantDesc = '你在四个维度上都有着非常强烈的偏好，几乎在所有情境下都表现出极端的一致性。这让你的人格特征极其鲜明，适合深耕特定的领域，但也可能让你在面对不同观点时显得固执。你是一个「坚定型」的变体，几乎不可能被改变。';
    } else {
      variantDesc = '你在某些维度上表现出非常强烈的偏好（>70%），而在其他维度上则相对温和。这让你既有人格上的鲜明特点，又保留了适应环境的弹性。你是一个「复合型」的变体，既知道自己要什么，也不排斥其他可能性。';
    }

    resultDesc.innerHTML = '<p>你的基础类型是 <strong>' + type + '</strong>（' + info.title + '），细分变体为 <strong>' + variant + '</strong>。</p>' +
      '<p>' + variantDesc + '</p>' +
      '<h3>维度倾向详解</h3>' +
      '<p>' +
      'E/I 维度：<strong>' + (counts.E >= counts.I ? '外向 E' : '内向 I') + '</strong>（E ' + counts.E + ' / I ' + counts.I + '，倾向度 ' + Math.round((counts.E >= counts.I ? counts.E / (counts.E + counts.I) : counts.I / (counts.E + counts.I)) * 100) + '%）<br>' +
      'S/N 维度：<strong>' + (counts.S >= counts.N ? '实感 S' : '直觉 N') + '</strong>（S ' + counts.S + ' / N ' + counts.N + '，倾向度 ' + Math.round((counts.S >= counts.N ? counts.S / (counts.S + counts.N) : counts.N / (counts.S + counts.N)) * 100) + '%）<br>' +
      'T/F 维度：<strong>' + (counts.T >= counts.F ? '思考 T' : '情感 F') + '</strong>（T ' + counts.T + ' / F ' + counts.F + '，倾向度 ' + Math.round((counts.T >= counts.F ? counts.T / (counts.T + counts.F) : counts.F / (counts.T + counts.F)) * 100) + '%）<br>' +
      'J/P 维度：<strong>' + (counts.J >= counts.P ? '判断 J' : '知觉 P') + '</strong>（J ' + counts.J + ' / P ' + counts.P + '，倾向度 ' + Math.round((counts.J >= counts.P ? counts.J / (counts.J + counts.P) : counts.P / (counts.J + counts.P)) * 100) + '%）' +
      '</p>' +
      '<h3>关于 64 人格测试</h3>' +
      '<p>传统的 MBTI 16 型人格只看四个字母的组合，但人在每个维度上的「强烈程度」是不同的。64 人格测试通过观察你在每个维度上的倾向度，为你加上了一个后缀，从而细分出 64 种亚型。这能帮你更精准地理解自己的行为模式。</p>';
      
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    saveToHistory(variant, currentVersion, counts);
  }

  function restartTest() {
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    resultArea.classList.add('hidden');
    quizArea.classList.remove('hidden');
    renderQuestion();
  }

  versionTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const v = parseInt(tab.dataset.version);
      if (v !== currentVersion) resetState(v);
    });
  });

  nextBtn.addEventListener('click', goToNext);
  prevBtn.addEventListener('click', goToPrev);
  restartBtn.addEventListener('click', restartTest);

  mainHistoryToggle.addEventListener('click', () => {
    if (mainHistorySection.classList.contains('hidden')) {
      renderHistory();
      mainHistorySection.classList.remove('hidden');
    } else {
      mainHistorySection.classList.add('hidden');
    }
  });

  mainHistoryClear.addEventListener('click', () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderHistory();
  });

  resetState(40);
})();
</script>
