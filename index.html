<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>MBTI 64人格 · 终极测试</title>
<style>
  html { color-scheme: light only; background: #f5f5f5; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  *::selection { background: transparent; color: inherit; }
  body { background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; color-scheme: light only; }
  .test-container { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); padding: 40px 35px; max-width: 800px; width: 100%; border: 1px solid #eaeaea; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600; color: #0b2b4a; text-align: center; margin-bottom: 8px; letter-spacing: -0.02em; }
  .subhead { text-align: center; color: #4a5b6b; font-size: clamp(0.85rem, 3vw, 1rem); margin-bottom: 24px; border-bottom: 1px solid #e0e0e0; padding-bottom: 18px; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .version-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; flex: 1; }
  .version-tab { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }
  .version-tab:hover { background: #fff; border-color: #1e3c5a; }
  .version-tab.active { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .version-tab .badge { display: inline-block; background: #eef1f4; color: #0b2b4a; font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 30px; margin-left: 6px; }
  .version-tab.active .badge { background: #fff; color: #0b2b4a; }
  .history-toggle { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 0.95rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; white-space: nowrap; }
  .history-toggle:hover { background: #fff; border-color: #1e3c5a; }
  .history-section { margin-bottom: 22px; border: 1px solid #eaeaea; background: #f9fafb; border-radius: 18px; padding: 16px 18px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #0b2b4a; font-weight: 600; font-size: 1rem; }
  .history-clear { background: none; border: none; color: #4a5b6b; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
  .history-item { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; cursor: pointer; transition: all 0.2s; }
  .history-item:hover { border-color: #1e3c5a; box-shadow: 0 4px 12px rgba(30,60,90,0.08); }
  .history-item .h-type { font-weight: 700; color: #0b2b4a; font-size: 1rem; }
  .history-item .h-meta { font-size: 0.8rem; color: #6b7d8f; }
  .history-empty { color: #8a9aa8; font-size: 0.9rem; padding: 4px 0; }
  .progress-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-weight: 500; gap: 8px; flex-wrap: wrap; }
  .question-counter { background: #f0f2f4; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; color: #0b2b4a; border: 1px solid #d6dde3; white-space: nowrap; }
  .progress-bar-bg { flex-grow: 1; min-width: 100px; height: 8px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 8px; background: #1e3c5a; width: 0%; border-radius: 10px; transition: width .15s ease; }
  .question-text { font-size: clamp(1.05rem, 4vw, 1.4rem); font-weight: 500; color: #0b2b4a; line-height: 1.45; margin-bottom: 26px; min-height: 70px; display: flex; align-items: center; }
  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
  .option-btn { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 16px; padding: 14px 18px; font-size: clamp(0.9rem, 3.2vw, 1rem); font-weight: 500; color: #1e3c5a; text-align: left; cursor: pointer; transition: all .1s ease; display: flex; align-items: flex-start; line-height: 1.45; word-break: break-word; }
  .option-btn:hover { background: #fff; border-color: #1e3c5a; box-shadow: 0 4px 12px rgba(0,20,40,.06); }
  .option-btn.selected { background: #fff; border-color: #1e3c5a; border-width: 2px; box-shadow: 0 4px 14px rgba(20,50,80,.1); }
  .option-letter { display: inline-block; width: 24px; height: 24px; background: #eef1f4; border-radius: 50%; text-align: center; line-height: 24px; font-size: 0.8rem; font-weight: 600; color: #0b2b4a; margin-right: 12px; flex-shrink: 0; margin-top: 1px; }
  .option-btn.selected .option-letter { background: #1e3c5a; color: #fff; }
  .nav-buttons { display: flex; justify-content: space-between; gap: 12px; }
  .nav-btn { background: #fff; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 11px 26px; font-size: clamp(0.9rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; flex: 1; }
  .nav-btn:hover:not(:disabled) { background: #f0f4f8; border-color: #1e3c5a; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-btn.primary { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .nav-btn.primary:hover:not(:disabled) { background: #0b2b4a; border-color: #0b2b4a; }
  .result-screen { padding: 10px 0 6px; }
  .result-header { text-align: center; margin-bottom: 8px; }
  .result-type { font-size: clamp(2.4rem, 12vw, 4.2rem); font-weight: 700; color: #0b2b4a; letter-spacing: 2px; line-height: 1.1; margin-bottom: 10px; }
  .result-title { font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 500; color: #1e3c5a; margin-bottom: 6px; }
  .result-tagline { font-size: clamp(0.9rem, 3vw, 1rem); color: #4a5b6b; margin-bottom: 22px; }
  .dims-bar { display: flex; flex-direction: column; gap: 10px; background: #f9fafb; border: 1px solid #eaeaea; border-radius: 18px; padding: 16px 18px; margin-bottom: 26px; }
  .dim-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #1e3c5a; }
  .dim-label { width: 46px; font-weight: 600; color: #0b2b4a; text-align: center; font-size: 0.8rem; flex-shrink: 0; }
  .dim-track { flex-grow: 1; min-width: 60px; height: 18px; background: #e9ecef; border-radius: 20px; overflow: hidden; display: flex; }
  .dim-fill-left { height: 100%; background: #1e3c5a; }
  .dim-fill-right { height: 100%; background: #b0c4d4; }
  .dim-pct { width: 40px; text-align: right; font-weight: 500; color: #1e3c5a; font-size: 0.8rem; flex-shrink: 0; }
  .result-desc { font-size: clamp(0.9rem, 3.2vw, 1rem); color: #3f5567; line-height: 1.85; margin-bottom: 26px; border-top: 1px solid #e0e0e0; padding-top: 22px; }
  .result-desc p { margin-bottom: 16px; text-indent: 2em; text-align: justify; }
  .result-desc h3 { font-size: 1.15rem; color: #0b2b4a; margin: 28px 0 14px; font-weight: 600; border-left: 4px solid #1e3c5a; padding-left: 10px; text-indent: 0; }
  .result-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
  .restart-btn { background: #fff; border: 1.5px solid #1e3c5a; border-radius: 40px; padding: 13px 36px; font-size: clamp(0.95rem, 3vw, 1.05rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }
  .restart-btn:hover { background: #1e3c5a; color: #fff; }
  .hidden { display: none; }
  @media (max-width: 560px) {
    body { padding: 0; }
    .test-container { border-radius: 0; border: none; box-shadow: none; padding: 20px 16px 30px; min-height: 100vh; }
    .top-bar { flex-direction: row; align-items: center; }
    .version-tabs { justify-content: flex-start; gap: 8px; }
    .version-tab { padding: 7px 14px; }
    .history-toggle { padding: 7px 14px; align-self: center; }
    .question-text { min-height: 60px; }
    .option-btn { padding: 12px 14px; }
    .option-letter { width: 22px; height: 22px; line-height: 22px; font-size: 0.75rem; margin-right: 10px; }
    .nav-btn { padding: 11px 16px; }
    .dims-bar { padding: 14px 14px; }
    .result-desc { padding-top: 18px; }
  }
  @media (max-width: 380px) {
    .version-tab .badge { display: none; }
    .dim-label { width: 38px; font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div class="test-container">
  <h1>MBTI 64人格 · 普通版</h1>
  <div class="subhead">16型人格亚型 · 动态万字级解析</div>

  <div class="top-bar">
    <div class="version-tabs">
      <button class="version-tab active" data-version="100">普通版 <span class="badge">100题</span></button>
    </div>
    <button class="history-toggle" id="mainHistoryToggle">历史记录</button>
  </div>

  <div class="history-section hidden" id="mainHistorySection">
    <div class="history-header">
      <span>测试历史（点击可查看解析）</span>
      <button class="history-clear" id="mainHistoryClear">清空</button>
    </div>
    <div class="history-list" id="mainHistoryList"></div>
  </div>

  <div id="quizArea">
    <div class="progress-area">
      <span class="question-counter" id="counter">1 / 100</span>
      <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
    </div>
    <div class="question-text" id="questionText">正在加载...</div>
    <div class="options" id="optionsContainer"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" disabled>上一题</button>
      <button class="nav-btn primary" id="nextBtn">下一题</button>
    </div>
  </div>

  <div id="resultArea" class="result-screen hidden">
    <div class="result-header">
      <div class="result-type" id="resultType">INFP-A</div>
      <div class="result-title" id="resultTitle">调停者</div>
      <div class="result-tagline" id="resultTagline"></div>
    </div>
    <div class="dims-bar" id="dimsBar"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-actions">
      <button class="restart-btn" id="restartBtn">重新测试</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ============================================================
  // 100题（普通版）独立题库 —— 100道完全唯一
  // ============================================================
  const NORMAL_BASE = [
    { text: "周末朋友临时约你出门，你的第一反应是：", options: [{ label: "欣然答应，正好想出去走走", value: "E" }, { label: "有点犹豫，更想按原计划休息", value: "I" }, { label: "看心情，可能去也可能不去", value: "P" }, { label: "先问清楚有哪些人再决定", value: "I" }] },
    { text: "学习一项新技能时，你更喜欢：", options: [{ label: "直接上手操作，从错误中学习", value: "S" }, { label: "先看教程，理解整体逻辑再动手", value: "N" }, { label: "找一个已经会的人带你入门", value: "E" }, { label: "自己摸索，不按常规出牌", value: "N" }] },
    { text: "在一场头脑风暴中，你更常是：", options: [{ label: "不断抛出天马行空点子的人", value: "N" }, { label: "判断哪个点子真正可行的人", value: "T" }, { label: "照顾到每个人是否被听见的人", value: "F" }, { label: "推动讨论按时收尾的人", value: "J" }] },
    { text: "如果给你一整天空闲，你更愿意：", options: [{ label: "约上朋友出去玩个痛快", value: "E" }, { label: "窝在家里看书、追剧或打游戏", value: "I" }, { label: "参加一个兴趣活动认识新朋友", value: "E" }, { label: "把家里收拾得干干净净", value: "J" }] },
    { text: "面对一份枯燥但稳定的工作，你更可能：", options: [{ label: "接受它，稳定压倒一切", value: "S" }, { label: "琢磨怎么把它做得更高效", value: "T" }, { label: "担心自己迟早会失去热情", value: "F" }, { label: "想办法寻找转型的机会", value: "N" }] },
    { text: "你更倾向于相信哪种说法？", options: [{ label: "过去的经验能指导未来", value: "S" }, { label: "未来永远有超出想象的可能", value: "N" }, { label: "逻辑推理比直觉更可靠", value: "T" }, { label: "直觉往往能捕捉到真相", value: "F" }] },
    { text: "当和好朋友意见不合时，你倾向于：", options: [{ label: "坚持己见，把道理讲清楚", value: "T" }, { label: "先退一步，避免伤和气", value: "F" }, { label: "先冷静一下，再找机会沟通", value: "I" }, { label: "当场直接说出来，一次解决", value: "E" }] },
    { text: "你的房间更可能是：", options: [{ label: "东西分类摆放，一目了然", value: "J" }, { label: "看起来乱但自己心里有数", value: "P" }, { label: "按颜色或主题布置", value: "F" }, { label: "实用为主，能住就行", value: "S" }] },
    { text: "看一部电影时，你更容易被什么打动？", options: [{ label: "缜密的剧情结构和逻辑", value: "T" }, { label: "人物的情感和命运", value: "F" }, { label: "画面和音效带来的感官冲击", value: "S" }, { label: "影片背后的隐喻和主题", value: "N" }] },
    { text: "你更倾向于用哪种方式解决问题？", options: [{ label: "列出步骤，逐一执行", value: "J" }, { label: "先试试看，边做边调整", value: "P" }, { label: "找有经验的人请教", value: "S" }, { label: "自己查资料，弄懂原理", value: "N" }] },
    { text: "在陌生的社交场合，你通常会：", options: [{ label: "主动找人聊天，很快熟络", value: "E" }, { label: "先观察，等别人来找你", value: "I" }, { label: "锁定一个聊得来的人深聊", value: "I" }, { label: "跟着朋友，让他带你认识人", value: "E" }] },
    { text: "你更看重一份工作的：", options: [{ label: "稳定的收入和保障", value: "S" }, { label: "成长空间和挑战性", value: "N" }, { label: "团队氛围和人际关系", value: "F" }, { label: "规则清晰、职责明确", value: "J" }] },
    { text: "当你感到压力很大时，你会：", options: [{ label: "找人倾诉，寻求安慰", value: "F" }, { label: "一个人静一静，消化情绪", value: "I" }, { label: "用行动解决问题，不去多想", value: "T" }, { label: "制定计划，把压力分解", value: "J" }] },
    { text: "你更容易记住一个人的：", options: [{ label: "长相和穿着细节", value: "S" }, { label: "说话时的气质和感觉", value: "N" }, { label: "说过的话和观点", value: "T" }, { label: "对你的态度和情绪", value: "F" }] },

    { text: "你更常因为什么而焦虑？", options: [{ label: "计划被打乱", value: "J" }, { label: "和人发生冲突", value: "F" }, { label: "想不通问题的逻辑", value: "T" }, { label: "觉得生活缺少新意", value: "N" }] },

  const POOL_EI_HIGH_E = [

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQuestions(base, count) {
    return shuffle(base).slice(0, count).map(q => ({
      text: q.text,
      options: shuffle(q.options).map(o => ({ label: o.label, value: o.value }))
    }));
  }

  function getQuestions() {
    return prepareQuestions(NORMAL_BASE, 100);
  }

  let questions = [];
  let currentQuestionIndex = 0;
  let answers = [];

  const quizArea = document.getElementById('quizArea');
  const resultArea = document.getElementById('resultArea');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resultType = document.getElementById('resultType');
  const resultTitle = document.getElementById('resultTitle');
  const resultTagline = document.getElementById('resultTagline');
  const dimsBar = document.getElementById('dimsBar');
  const resultDesc = document.getElementById('resultDesc');
  const restartBtn = document.getElementById('restartBtn');
  const mainHistoryToggle = document.getElementById('mainHistoryToggle');
  const mainHistorySection = document.getElementById('mainHistorySection');
  const mainHistoryList = document.getElementById('mainHistoryList');
  const mainHistoryClear = document.getElementById('mainHistoryClear');

  function resetState() {
    questions = getQuestions();
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    quizArea.classList.remove('hidden');
    resultArea.classList.add('hidden');
    renderQuestion();
  }

  function updateProgress() {
    const total = questions.length;
    const answered = answers.filter(a => a !== null).length;
    progressFill.style.width = (answered / total) * 100 + '%';
    counter.textContent = (currentQuestionIndex + 1) + ' / ' + total;
  }

  function renderQuestion() {
    const q = questions[currentQuestionIndex];
    questionText.textContent = q.text;
    const saved = answers[currentQuestionIndex];
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if (saved !== null && saved === opt.value) btn.classList.add('selected');
      btn.innerHTML = '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span>' + opt.label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        answers[currentQuestionIndex] = opt.value;
        updateProgress();
        updateNavButtons();
      });
      optionsContainer.appendChild(btn);
    });
    updateProgress();
    updateNavButtons();
  }

  function updateNavButtons() {
    prevBtn.disabled = currentQuestionIndex === 0;
    nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? '查看结果' : '下一题';
    const has = answers[currentQuestionIndex] !== null;
    if (!has && currentQuestionIndex < questions.length - 1) nextBtn.disabled = true;
    else nextBtn.disabled = false;
  }

  function goToNext() {
    if (currentQuestionIndex < questions.length - 1) {
      if (answers[currentQuestionIndex] === null) return;
      currentQuestionIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function goToPrev() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderQuestion();
    }
  }

  function calculate() {
    const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    answers.forEach(v => { if (v && counts.hasOwnProperty(v)) counts[v]++; });
    const total = answers.length || 1;
    const e = counts.E >= counts.I ? 'E' : 'I';
    const s = counts.S >= counts.N ? 'S' : 'N';
    const t = counts.T >= counts.F ? 'T' : 'F';
    const j = counts.J >= counts.P ? 'J' : 'P';
    let suffix = '';
    if (counts[e] / total > 0.7) suffix += e;
    if (counts[s] / total > 0.7) suffix += s;
    if (counts[t] / total > 0.7) suffix += t;
    if (counts[j] / total > 0.7) suffix += j;
    if (suffix.length === 0) suffix = 'A';
    else if (suffix.length === 4) suffix = 'T';
    return { type: e + s + t + j, variant: e + s + t + j + '-' + suffix, counts };
  }

  function renderDims(counts) {
    const totalEI = counts.E + counts.I || 1;
    const totalSN = counts.S + counts.N || 1;
    const totalTF = counts.T + counts.F || 1;
    const totalJP = counts.J + counts.P || 1;
    const dims = [
      { left: 'E', right: 'I', l: (counts.E / totalEI) * 100 },
      { left: 'S', right: 'N', l: (counts.S / totalSN) * 100 },
      { left: 'T', right: 'F', l: (counts.T / totalTF) * 100 },
      { left: 'J', right: 'P', l: (counts.J / totalJP) * 100 }
    ];
    dimsBar.innerHTML = dims.map(d => (
      '<div class="dim-row">' +
        '<span class="dim-label">' + d.left + ' ' + d.right + '</span>' +
        '<div class="dim-track">' +
          '<div class="dim-fill-left" style="width:' + d.l + '%"></div>' +
          '<div class="dim-fill-right" style="width:' + (100 - d.l) + '%"></div>' +
        '</div>' +
        '<span class="dim-pct">' + Math.round(d.l) + '%</span>' +
      '</div>'
    )).join('');
  }

  // ============================================================
  // 解析生成（普通版随机池）
  // ============================================================
  function generateDetailedText(type, variant, counts) {
    const info = TYPE_DESC[type] || { title: '探索者', tag: '独特的人格组合' };
    const pE = Math.round((counts.E / (counts.E + counts.I || 1)) * 100) || 0;
    const pI = 100 - pE;
    const pS = Math.round((counts.S / (counts.S + counts.N || 1)) * 100) || 0;
    const pN = 100 - pS;
    const pT = Math.round((counts.T / (counts.T + counts.F || 1)) * 100) || 0;
    const pF = 100 - pT;
    const pJ = Math.round((counts.J / (counts.J + counts.P || 1)) * 100) || 0;
    const pP = 100 - pJ;

    const used = new Set();
    const fill = (tpl) => tpl
      .replace(/{type}/g, type)
      .replace(/{variant}/g, variant)
      .replace(/{title}/g, info.title)
      .replace(/{tag}/g, info.tag);

    let html = `<h3>【基础画像】你是 ${variant}</h3>`;
    const intro = pickRandom(POOL_INTRO, used);
    html += `<p>${fill(intro)}</p>`;

    // 能量维度
    html += `<h3>【能量源】E/I 维度（外向 ${pE}% : 内向 ${pI}%）</h3>`;
    let eiPool;
    if (pE >= 80) eiPool = POOL_EI_HIGH_E;
    else if (pE >= 60) eiPool = POOL_EI_MID_E;
    else if (pI >= 80) eiPool = POOL_EI_HIGH_I;
    else eiPool = POOL_EI_MID_I;
    const ei = pickRandom(eiPool, used);
    if (ei) html += `<p>${fill(ei)}</p>`;

    // 信息维度
    html += `<h3>【信息雷达】S/N 维度（实感 ${pS}% : 直觉 ${pN}%）</h3>`;
    let snPool;
    if (pS >= 80) snPool = POOL_SN_HIGH_S;
    else if (pS >= 60) snPool = POOL_SN_MID_S;
    else if (pN >= 80) snPool = POOL_SN_HIGH_N;
    else snPool = POOL_SN_MID_N;
    const sn = pickRandom(snPool, used);
    if (sn) html += `<p>${fill(sn)}</p>`;

    // 决策维度
    html += `<h3>【决策天平】T/F 维度（思考 ${pT}% : 情感 ${pF}%）</h3>`;
    let tfPool;
    if (pT >= 80) tfPool = POOL_TF_HIGH_T;
    else if (pT >= 60) tfPool = POOL_TF_MID_T;
    else if (pF >= 80) tfPool = POOL_TF_HIGH_F;
    else tfPool = POOL_TF_MID_F;
    const tf = pickRandom(tfPool, used);
    if (tf) html += `<p>${fill(tf)}</p>`;

    // 生活维度
    html += `<h3>【生活节奏】J/P 维度（判断 ${pJ}% : 知觉 ${pP}%）</h3>`;
    let jpPool;
    if (pJ >= 80) jpPool = POOL_JP_HIGH_J;
    else if (pJ >= 60) jpPool = POOL_JP_MID_J;
    else if (pP >= 80) jpPool = POOL_JP_HIGH_P;
    else jpPool = POOL_JP_MID_P;
    const jp = pickRandom(jpPool, used);
    if (jp) html += `<p>${fill(jp)}</p>`;

    // 亲密关系
    html += `<h3>【亲密关系】如何爱与被爱</h3>`;
    const rel = pickRandom(POOL_RELATION, used);
    if (rel) html += `<p>${fill(rel)}</p>`;

    // 职场
    html += `<h3>【职场生存】你的优势与破局</h3>`;
    const work = pickRandom(POOL_WORK, used);
    if (work) html += `<p>${fill(work)}</p>`;

    // 成长总结
    html += `<h3>【终极命题】你的成长与破局之路</h3>`;
    const growth = pickRandom(POOL_GROWTH, used);
    if (growth) html += `<p>${fill(growth)}</p>`;
    const advice = pickRandom(POOL_ADVICE, used);
    if (advice) html += `<p>${fill(advice)}</p>`;

    // 结尾
    const ending = pickRandom(POOL_SHORT_100, used);
    if (ending) html += `<p>${fill(ending)}</p>`;

    return html;
  }

  // ============================================================
  // 历史记录
  // ============================================================
  function saveToHistory(variant, version, counts, descHtml) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    history.unshift({ variant, version, counts, descHtml, time: new Date().toLocaleString('zh-CN') });
    if (history.length > 20) history = history.slice(0, 20);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function renderHistory() {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    if (!history.length) {
      mainHistoryList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }
    mainHistoryList.innerHTML = history.map((h, index) => (
      '<div class="history-item" onclick="window.viewHistoryItem(' + index + ')">' +
        '<span class="h-type">' + h.variant + ' <span style="font-size:0.8rem;font-weight:normal;color:#6b7d8f;">(' + h.version + '题)</span></span>' +
        '<span class="h-meta">' + h.time + ' 点击查看解析</span>' +
      '</div>'
    )).join('');
  }

  window.viewHistoryItem = function(index) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    const item = history[index];
    if (!item) return;
    const info = TYPE_DESC[item.variant.substring(0, 4)] || { title: '探索者', tag: '独特的人格组合' };
    resultType.textContent = item.variant;
    resultTitle.textContent = info.title;
    resultTagline.textContent = info.tag;
    renderDims(item.counts);
    resultDesc.innerHTML = item.descHtml;
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    mainHistorySection.classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // ============================================================
  // 结果展示
  // ============================================================
  function showResult() {
    if (answers.some(a => a === null)) {
      for (let i = 0; i < answers.length; i++) {
        if (answers[i] === null) {
          currentQuestionIndex = i;
          renderQuestion();
          return;
        }
      }
    }
    const { type, variant, counts } = calculate();
    const info = TYPE_DESC[type] || { title: '探索者', tag: '独特的人格组合' };
    resultType.textContent = variant;
    resultTitle.textContent = info.title;
    resultTagline.textContent = info.tag;
    renderDims(counts);
    const descHtml = generateDetailedText(type, variant, counts);
    resultDesc.innerHTML = descHtml;
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    saveToHistory(variant, 100, counts, descHtml);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restartTest() {
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    resultArea.classList.add('hidden');
    quizArea.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  nextBtn.addEventListener('click', goToNext);
  prevBtn.addEventListener('click', goToPrev);
  restartBtn.addEventListener('click', restartTest);

  mainHistoryToggle.addEventListener('click', () => {
    if (mainHistorySection.classList.contains('hidden')) {
      renderHistory();
      mainHistorySection.classList.remove('hidden');
    } else {
      mainHistorySection.classList.add('hidden');
    }
  });

  mainHistoryClear.addEventListener('click', () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderHistory();
  });

  resetState();
})();
</script>
</body>
